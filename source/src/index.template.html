<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e3e9f2">
<title>Whiteout Survival - Playable</title>
<link rel="icon" href="data:,">
<style>
/*FONTS*/
:root{--ui:1;--eu:1;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e3e9f2;position:fixed;inset:0;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;outline:none}
#haze{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 14%,rgba(255,255,255,0) 30%),radial-gradient(120% 90% at 50% 55%,rgba(255,214,200,0) 60%,rgba(255,225,215,.07) 100%)}
#ui{position:fixed;inset:0;overflow:hidden;font-family:'Lilita One','Arial Black',sans-serif;cursor:grab}
#ui:active{cursor:grabbing}
#hud{position:absolute;left:calc(var(--sl) + 8px*var(--ui));top:calc(var(--st) + 20px*var(--ui));pointer-events:none}
#money{position:relative;width:calc(212px*var(--ui));height:calc(60px*var(--ui))}
#bill{position:absolute;left:0;top:0;width:calc(94px*var(--ui));z-index:2;filter:drop-shadow(0 calc(2px*var(--ui)) calc(2px*var(--ui)) rgba(20,40,20,.35))}
#bill svg{display:block;width:100%}
#pill{position:absolute;left:calc(60px*var(--ui));top:calc(9px*var(--ui));width:calc(148px*var(--ui));height:calc(41px*var(--ui));
  border-radius:calc(21px*var(--ui));background:rgba(58,66,84,.58);border:calc(2px*var(--ui)) solid rgba(24,28,40,.8);z-index:1}
#amount{position:absolute;left:62%;top:50%;transform:translate(-50%,-52%);color:#fff;font-size:calc(31px*var(--ui));line-height:1;
  -webkit-text-stroke:calc(5px*var(--ui)) #23262f;paint-order:stroke fill;letter-spacing:calc(.5px*var(--ui))}
#amount.bump{animation:bump .14s ease-out}
@keyframes bump{0%{transform:translate(-50%,-52%) scale(1.22)}100%{transform:translate(-50%,-52%) scale(1)}}
#mark{position:absolute;left:calc(20px*var(--ui));top:calc(66px*var(--ui));width:calc(160px*var(--ui));opacity:.93;display:block}
#hint{position:absolute;left:50%;bottom:calc(var(--sb) + 9%);transform:translateX(-50%);opacity:0;transition:opacity .35s;pointer-events:none;text-align:center}
#hint.on{opacity:1}
#hint-hand{width:calc(64px*var(--ui));margin:0 auto;animation:swipe 1.5s ease-in-out infinite}
#hint-hand svg{display:block;width:100%;filter:drop-shadow(0 3px 4px rgba(30,20,30,.35))}
#hint-text{margin-top:calc(4px*var(--ui));color:#fff;font-size:calc(30px*var(--ui));-webkit-text-stroke:calc(5px*var(--ui)) #2a2d3a;paint-order:stroke fill;letter-spacing:1px;white-space:nowrap}
@keyframes swipe{0%,100%{transform:translate(-46%,0) rotate(-8deg)}50%{transform:translate(46%,-18%) rotate(8deg)}}
#stick{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;transition:opacity .12s}
#stick.on{opacity:1}
#stick::before{content:"";position:absolute;left:calc(-66px*var(--ui));top:calc(-66px*var(--ui));width:calc(132px*var(--ui));height:calc(132px*var(--ui));
  border-radius:50%;background:rgba(255,255,255,.16);border:calc(3px*var(--ui)) solid rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(40,30,40,.25)}
#knob{position:absolute;left:calc(-27px*var(--ui));top:calc(-27px*var(--ui));width:calc(54px*var(--ui));height:calc(54px*var(--ui));border-radius:50%;
  background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(40,30,40,.4)}
#edge{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none}
#edge.on{opacity:1}
#edge::before{content:"";position:absolute;left:calc(-30px*var(--ui));top:calc(-17px*var(--ui));border-style:solid;
  border-width:calc(17px*var(--ui)) 0 calc(17px*var(--ui)) calc(30px*var(--ui));border-color:transparent transparent transparent #ffd53a;
  filter:drop-shadow(0 0 3px #fff) drop-shadow(0 2px 3px rgba(60,30,0,.5));animation:nudge .7s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(-6px)}50%{transform:translateX(4px)}}
#white{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff 0%,#f4f7fb 60%,#e6ecf5 100%);opacity:0;pointer-events:none;transition:opacity .6s ease-in;z-index:5}
#white.on{opacity:1}
#end{position:absolute;inset:0;display:none;z-index:4;cursor:default}
#end.on{display:block}
#hint-keys{display:none;margin-top:calc(2px*var(--ui));color:#fff;font-family:'Russo One','Arial Black',sans-serif;font-size:calc(15px*var(--ui));-webkit-text-stroke:calc(3.5px*var(--ui)) #2a2d3a;paint-order:stroke fill;white-space:nowrap}
@media (hover:hover) and (pointer:fine){#hint-keys{display:block}}
body.ended #hud,body.ended #hint,body.ended #stick,body.ended #edge{display:none}
#end-logo{position:absolute;left:50%;top:calc(var(--st) + 7.6%);width:calc(452px*var(--eu));margin-left:calc(-226px*var(--eu));animation:logoIn .55s cubic-bezier(.2,1.5,.4,1) .12s both;pointer-events:none}
#end-tag{position:absolute;left:50%;top:calc(var(--st) + 7.6% + 178px*var(--eu));width:calc(440px*var(--eu));margin-left:calc(-220px*var(--eu));animation:tagIn .4s ease-out .5s both;cursor:pointer}
#cta{position:absolute;left:50%;bottom:calc(var(--sb) + 44px*var(--eu));transform:translateX(-50%);display:flex;align-items:center;gap:calc(14px*var(--eu));white-space:nowrap}
#search{position:relative;width:calc(296px*var(--eu));height:calc(44px*var(--eu));border-radius:calc(7px*var(--eu));background:#fbfbfe;
  box-shadow:0 0 0 calc(2px*var(--eu)) rgba(255,255,255,.75),0 calc(2px*var(--eu)) calc(8px*var(--eu)) rgba(90,100,140,.28);
  animation:popIn .3s cubic-bezier(.2,1.5,.4,1) .85s both;cursor:pointer;display:flex;align-items:center;padding:0 calc(14px*var(--eu))}
#typed{font-family:'Russo One','Arial Black',sans-serif;font-size:calc(19px*var(--eu));color:#b3b8cf;letter-spacing:calc(.6px*var(--eu))}
#search i{position:absolute;right:calc(12px*var(--eu));top:50%;width:calc(26px*var(--eu));height:calc(26px*var(--eu));transform:translateY(-50%)}
#badges{display:flex;gap:calc(12px*var(--eu))}
.badge{height:calc(44px*var(--eu));width:calc(142px*var(--eu));border-radius:calc(7px*var(--eu));background:#050505;border:calc(1.2px*var(--eu)) solid #b9b9b9;
  display:flex;align-items:center;gap:calc(7px*var(--eu));padding:0 calc(9px*var(--eu));color:#fff;font-family:Helvetica,Arial,sans-serif;cursor:pointer}
.badge:active,#search:active{filter:brightness(.85)}
.badge i{width:calc(24px*var(--eu));flex:none;display:block}
.badge svg,#search svg,#replay svg{display:block;width:100%;height:100%}
.badge span{display:flex;flex-direction:column;line-height:1}
.badge small{font-size:calc(9px*var(--eu));letter-spacing:.2px}
.badge b{font-size:calc(19px*var(--eu));font-weight:500;letter-spacing:-.3px;margin-top:calc(1px*var(--eu))}
#b-apple{animation:popIn .3s cubic-bezier(.2,1.5,.4,1) 1s both}
#b-google{animation:dropIn .35s cubic-bezier(.2,1.3,.4,1) 1.1s both}
#b-google small{font-size:calc(8px*var(--eu))}
#b-google b{font-size:calc(18px*var(--eu))}
#replay{position:absolute;right:calc(var(--sr) + 14px*var(--ui));top:calc(var(--st) + 14px*var(--ui));width:calc(46px*var(--ui));height:calc(46px*var(--ui));
  border-radius:50%;border:0;background:rgba(52,66,96,.5);padding:calc(10px*var(--ui));cursor:pointer;animation:fadeIn .5s ease 2.6s both}
#replay:active{background:rgba(52,66,96,.8)}
@keyframes logoIn{0%{opacity:0;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
@keyframes tagIn{0%{opacity:0;transform:translateY(-30%) scale(.9)}100%{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-90%)}100%{opacity:1;transform:none}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
/* landscape: title block on the left, characters on the right */
body.land #end-logo{left:calc(var(--sl) + 27%);top:calc(var(--st) + 6%)}
body.land #end-tag{left:calc(var(--sl) + 27%);top:calc(var(--st) + 6% + 176px*var(--eu))}
body.land #cta{left:calc(var(--sl) + 27%);bottom:auto;top:calc(var(--st) + 6% + 262px*var(--eu));flex-direction:column}
/* tall phones: search bar above the store badges so the block can be larger */
body.tall #cta{flex-direction:column;bottom:calc(var(--sb) + 30px*var(--eu))}
#fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:16px/1.4 sans-serif;color:#334;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="haze"></div>
<div id="ui"></div>
<div id="fail">This playable needs WebGL, which this browser or device does not provide.</div>
<script>
/*SCRIPT*/
</script>
</body>
</html>
